spring:
  flyway:
    enabled: true
    locations: classpath:db/migration/mysql
    clean-disabled: true
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  h2:
    console:
      enabled: false
  datasource:
    url: ${PET_DB_URL:jdbc:mysql://localhost:3306/pet_grooming?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${PET_DB_USER:root}
    password: ${PET_DB_PASSWORD:}
pet-grooming:
  seed-enabled: ${PET_SEED_ENABLED:${PET_DEMO_SEED_ENABLED:false}}
  bootstrap-admin-password: ${PET_BOOTSTRAP_ADMIN_PASSWORD:}
